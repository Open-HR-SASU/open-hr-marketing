name: Deploy to Bunny Edge Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: tbkdha33
          PUBLIC_SANITY_DATASET: production

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run accessibility tests
        run: npx playwright test

      - name: Deploy to Bunny Storage
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
        run: |
          set -e

          # Storage endpoint (Frankfurt region - per Context7 docs)
          STORAGE_URL="https://storage.bunnycdn.com/${BUNNY_STORAGE_ZONE}"

          echo "=== Deploying to Bunny Storage Zone ==="
          echo "Zone: ${BUNNY_STORAGE_ZONE}"
          echo "Endpoint: ${STORAGE_URL}"

          # Upload all files from dist/
          # Bunny creates directories automatically on file upload
          cd ./dist

          uploaded=0
          failed=0

          for file in $(find . -type f); do
            # Remove leading ./
            rel_path="${file#./}"

            # Upload file
            http_code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              "${STORAGE_URL}/${rel_path}" \
              -H "AccessKey: ${BUNNY_STORAGE_KEY}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}")

            if [ "$http_code" = "201" ] || [ "$http_code" = "200" ]; then
              uploaded=$((uploaded + 1))
            else
              echo "WARN: Failed to upload ${rel_path} (HTTP ${http_code})"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "=== Upload Complete ==="
          echo "Uploaded: ${uploaded} files"
          echo "Failed: ${failed} files"

          if [ "$failed" -gt 0 ]; then
            echo "ERROR: Some files failed to upload"
            exit 1
          fi

      - name: Purge CDN Cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
        run: |
          set -e

          echo "Waiting 15s for storage zone replication..."
          sleep 15

          echo "Purging pull zone ${BUNNY_PULL_ZONE_ID}..."

          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d: -f2)
          body=$(echo "$response" | grep -v "HTTP_CODE:")

          echo "Response: HTTP ${http_code}"

          # Per Context7: 204 = success, no content returned
          if [ "$http_code" != "204" ] && [ "$http_code" != "200" ]; then
            echo "ERROR: Cache purge failed"
            echo "Body: ${body}"
            exit 1
          fi

          echo "Cache purged successfully."

      - name: Notify IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          set -e

          INDEXNOW_KEY="046093a15bdb7f18ca706e52ead3b375"
          SITE_HOST="open-hr.work"

          # Extract all URLs from sitemap
          urls=$(grep -oP 'https://open-hr\.work[^<]+' dist/sitemap-0.xml | sort -u)
          url_count=$(echo "$urls" | wc -l | tr -d ' ')

          echo "=== IndexNow: Submitting ${url_count} URLs ==="

          # Build JSON array of URLs
          url_json=$(echo "$urls" | jq -R -s 'split("\n") | map(select(length > 0))')

          # Submit batch to IndexNow API
          response=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"${SITE_HOST}\",
              \"key\": \"${INDEXNOW_KEY}\",
              \"keyLocation\": \"https://${SITE_HOST}/${INDEXNOW_KEY}.txt\",
              \"urlList\": ${url_json}
            }")

          http_code=$(echo "$response" | grep "HTTP_CODE:" | cut -d: -f2)

          # IndexNow: 200 = OK, 202 = Accepted (queued)
          if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
            echo "IndexNow submitted successfully (HTTP ${http_code})"
          else
            echo "WARN: IndexNow returned HTTP ${http_code} (non-fatal)"
            echo "Body: $(echo "$response" | grep -v "HTTP_CODE:")"
          fi
