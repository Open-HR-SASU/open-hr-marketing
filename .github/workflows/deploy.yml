name: Deploy to Bunny Edge Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: tbkdha33
          PUBLIC_SANITY_DATASET: production

      - name: Deploy to Bunny Storage
        uses: R-J-dev/bunny-deploy@v2.0.2
        with:
          # Storage zone credentials
          storage-zone-name: ${{ secrets.BUNNY_STORAGE_ZONE }}
          storage-zone-password: ${{ secrets.BUNNY_STORAGE_KEY }}
          storage-endpoint: "https://storage.bunnycdn.com"

          # Upload configuration
          directory-to-upload: "./dist"
          concurrency: "50"

          # Delete remote files not in local build
          enable-delete-action: true

          # Cache purge configuration
          access-key: ${{ secrets.BUNNY_API_KEY }}
          enable-purge-pull-zone: true
          pull-zone-id: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          replication-timeout: "15000"

