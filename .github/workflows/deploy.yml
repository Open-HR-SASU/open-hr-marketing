name: Deploy to Bunny Edge Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: tbkdha33
          PUBLIC_SANITY_DATASET: production

      - name: Deploy to Bunny Edge Storage
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.2
        with:
          source: ./dist
          destination: /
          storageZoneName: ${{ secrets.BUNNY_STORAGE_ZONE }}
          storagePassword: ${{ secrets.BUNNY_STORAGE_KEY }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          upload: true
          remove: true
          purgePullZone: true
