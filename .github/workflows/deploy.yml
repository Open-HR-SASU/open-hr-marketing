name: Deploy to Bunny Edge Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: tbkdha33
          PUBLIC_SANITY_DATASET: production

      - name: Deploy to Bunny Storage via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: storage.bunnycdn.com
          username: ${{ secrets.BUNNY_STORAGE_ZONE }}
          password: ${{ secrets.BUNNY_STORAGE_KEY }}
          local-dir: ./dist/
          dangerous-clean-slate: true

      - name: Purge Bunny CDN Cache
        run: |
          curl -X POST \
            "https://api.bunny.net/pullzone/${{ secrets.BUNNY_PULL_ZONE_ID }}/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
            -H "Content-Type: application/json"
          echo "Cache purged successfully"
